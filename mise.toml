[dotfiles]
"~/.config/bat" = { source = "bat"}
"~/.config/git" = { source = "git"}
"~/.config/nvim" = { source = "nvim"}
"~/.config/starship.toml" = { source = "starship/starship.toml"}
"~/.config/zellij" = { source = "zellij"}

## zsh
"~/.zshrc" = { source = "zsh/zshrc"}
"~/.zsh_plugins.txt" = { source = "zsh/zsh_plugins.txt"}
"~/.oh-my-zsh-custom" = { source = "zsh/oh-my-zsh-custom"}

##
# OS X Specific
[dotfiles."hammerspoon"]
source = "hammerspoon"
variants = [
  { os = "macos", target = "~/.hammerspoon" }
]

[dotfiles."yabai"]
source = "yabai"
variants = [
  { os = "macos", target = "~/.config/yabai" }
]
